[project]
name = "opsly"
version = "0.1.0"
description = "Multi-agent MCP system for FastAPI codebase analysis"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Environment
    "python-dotenv>=1.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.2.0",
    # Neo4j
    "neo4j>=5.26.0",
    # MongoDB async driver
    "motor>=3.6.0",
    # Milvus vector DB
    "pymilvus>=2.5.0",
    # HTTP client
    "httpx>=0.28.0",
    # Async file ops
    "aiofiles>=24.1.0",
    # LLM providers (multi-provider abstraction)
    "litellm>=1.55.0",
    # Local embeddings
    "sentence-transformers>=3.3.0",
    # Git operations
    "gitpython>=3.1.0",
    # Streaming support
    "sse-starlette>=2.1.0",
    # WebSocket
    "websockets>=14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-aiofiles>=24.1.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
