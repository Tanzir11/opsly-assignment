version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────

  neo4j:
    image: neo4j:5-community
    container_name: opsly-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/opsly_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: opsly-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: opsly-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: opsly-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: opsly-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ─── MCP Agent Servers ───────────────────────────────────────────────

  orchestrator-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        AGENT_MODULE: orchestrator
        AGENT_PORT: 8001
    container_name: opsly-orchestrator
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: opsly_dev_password
      MONGODB_URI: mongodb://mongodb:27017
      MILVUS_HOST: milvus
      INDEXER_AGENT_URL: http://indexer-agent:8002
      GRAPH_QUERY_AGENT_URL: http://graph-query-agent:8003
      CODE_ANALYST_AGENT_URL: http://code-analyst-agent:8004
      RETRIEVAL_MEMORY_AGENT_URL: http://retrieval-memory-agent:8005
    command: ["uvicorn", "src.modules.orchestrator.server:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  indexer-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        AGENT_MODULE: indexer
        AGENT_PORT: 8002
    container_name: opsly-indexer
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: opsly_dev_password
      MONGODB_URI: mongodb://mongodb:27017
      MILVUS_HOST: milvus
    volumes:
      - repo_cache:/tmp/opsly/repos
    command: ["uvicorn", "src.modules.indexer.server:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8002/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  graph-query-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        AGENT_MODULE: graph_query
        AGENT_PORT: 8003
    container_name: opsly-graph-query
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: opsly_dev_password
    command: ["uvicorn", "src.modules.graph_query.server:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8003/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  code-analyst-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        AGENT_MODULE: code_analyst
        AGENT_PORT: 8004
    container_name: opsly-code-analyst
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: opsly_dev_password
    volumes:
      - repo_cache:/tmp/opsly/repos
    command: ["uvicorn", "src.modules.code_analyst.server:app", "--host", "0.0.0.0", "--port", "8004"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8004/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  retrieval-memory-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        AGENT_MODULE: retrieval_memory
        AGENT_PORT: 8005
    container_name: opsly-retrieval-memory
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MILVUS_HOST: milvus
    command: ["uvicorn", "src.modules.retrieval_memory.server:app", "--host", "0.0.0.0", "--port", "8005"]
    depends_on:
      mongodb:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8005/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── API Gateway ─────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: opsly-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ORCHESTRATOR_AGENT_URL: http://orchestrator-agent:8001
      INDEXER_AGENT_URL: http://indexer-agent:8002
      GRAPH_QUERY_AGENT_URL: http://graph-query-agent:8003
      CODE_ANALYST_AGENT_URL: http://code-analyst-agent:8004
      RETRIEVAL_MEMORY_AGENT_URL: http://retrieval-memory-agent:8005
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      orchestrator-agent:
        condition: service_healthy
      indexer-agent:
        condition: service_healthy
      graph-query-agent:
        condition: service_healthy
      code-analyst-agent:
        condition: service_healthy
      retrieval-memory-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
  etcd_data:
  minio_data:
  milvus_data:
  repo_cache:
